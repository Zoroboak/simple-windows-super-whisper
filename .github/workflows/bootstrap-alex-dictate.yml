name: Bootstrap Alex Dictate source

on:
  push:
    branches: [alex-dictate-v1-final]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-alex-dictate.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/alex-dictate-v1.0.0.b64.* | base64 -d > /tmp/alex-dictate.zip
          unzip -t /tmp/alex-dictate.zip
          rm -rf /tmp/alex-dictate
          unzip -q /tmp/alex-dictate.zip -d /tmp/alex-dictate
      - name: Replace legacy source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          find .github/workflows -type f ! -name bootstrap-alex-dictate.yml -delete || true
          cp -a /tmp/alex-dictate/alex-dictate/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-alex-dictate.yml
      - name: Validate JavaScript
        run: |
          node --version
          npm run check
          npm test
      - name: Commit expanded project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild as Alex Dictate cross-platform" || exit 0
          git push
