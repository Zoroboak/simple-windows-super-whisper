name: Synchronize release metadata
on:
  push:
    branches: [release-1.2.1]
    paths: ['.github/workflows/prepare-release.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize manifest and dependency lock version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['package.json', 'package-lock.json']) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            value.version = '1.2.1';
            if (value.packages?.['']) value.packages[''].version = '1.2.1';
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          }
          const notes = fs.readFileSync('docs/RELEASE-NOTES.md', 'utf8');
          fs.writeFileSync('docs/RELEASE-NOTES.md', '## Alex Dictate 1.2.1\n\nCorrección de distribución: los nombres publicados coinciden con los URL del actualizador. CI verifica todos los tamaños y hashes SHA-512 antes de publicar y comprueba que GitHub conserva los nombres. Usa esta versión en lugar de 1.2.0.\n\n' + notes);
          const readme = fs.readFileSync('README.md', 'utf8').replace('# Alex Dictate · 1.2', '# Alex Dictate · 1.2.1');
          fs.writeFileSync('README.md', readme);
          const log = fs.readFileSync('CHANGELOG.md', 'utf8');
          fs.writeFileSync('CHANGELOG.md', '# 1.2.1\n\n- Normalización de nombres de instalador para GitHub Releases.\n- Validación automática de URL, tamaño y SHA-512 del actualizador.\n- Misma funcionalidad de dictado y configuración que 1.2.0.\n\n' + log);
          NODE
      - name: Commit synchronized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md CHANGELOG.md docs/RELEASE-NOTES.md
          git commit -m 'release: synchronize 1.2.1 manifests and distribution notes'
          git push
