name: Bootstrap Alex Dictate v1.1

on:
  push:
    branches: [alex-dictate-v1.1]
    paths:
      - ".bootstrap-v11/**"
      - ".github/workflows/bootstrap-v11.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v1.1 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap-v11/patch.*.b64)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Bootstrap chunks already removed; nothing to apply."
            exit 0
          fi
          cat "${parts[@]}" | base64 -d | gzip -dc > /tmp/alex-v11.patch
          patch --dry-run -p2 < /tmp/alex-v11.patch
          patch -p2 < /tmp/alex-v11.patch
          rm -rf .bootstrap-v11

      - name: Validate source
        run: |
          npm run check
          npm test

      - name: Commit expanded v1.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Alex Dictate v1.1 resilient routing and audio" || exit 0
          git push
